openapi: 3.1.0
info:
  title: Sistema de Gestión de Transporte y Movilización Institucional - ULEAM
  description: "# API del Sistema de Gestión de Transporte y Flota Institucional (ULEAM)\n\nBienvenido\
    \ a la documentación oficial e interactiva de la API REST del Sistema de Transporte de la Universidad\
    \ Laica Eloy Alfaro de Manabí (ULEAM), impulsada por **Scalar**.\n\n---\n\n## \U0001F3DB️ Propósito\
    \ y Alcance\nEsta plataforma automatiza el ciclo integral de transporte universitario, desde la solicitud\
    \ docente hasta la liquidación final de viáticos y auditoría técnica:\n1. **Gestión de Solicitudes:**\
    \ Movilizaciones académicas internas (dentro de la provincia) y externas (nacionales).\n2. **Flujo\
    \ de Autorizaciones:** Filtro por Secretaría/Jefatura de Transporte y Vicerrectorado Académico/Rectorado.\n\
    3. **Planificación y Asignación:** Generación de hojas de ruta, asignación de choferes, vehículos\
    \ y agenda operativa.\n4. **Inspecciones y Mantenimiento Técnico:** Checklist digital de componentes,\
    \ neumáticos, actas de entrega/recepción en garita y órdenes de taller.\n5. **Combustible:** Convenios\
    \ con estaciones de servicio y órdenes de abastecimiento con código de validación.\n6. **Liquidación\
    \ y Viáticos:** Cálculo transparente de horas extras y subsistencias bajo normativa institucional.\n\
    7. **Documentos Oficiales y registro de firma HMAC de la aplicación:** Trazabilidad documental con\
    \ sellos de tiempo, firmas criptográficas SHA-256 e interoperabilidad de códigos de calidad (PST-01-F-003,\
    \ PST-01-F-006, PST-01-F-004.1, PST-01-F-003-OT, PAM-04-F-007).\n\n---\n\n## \U0001F510 Autenticación\
    \ y Seguridad\nLa API utiliza **Laravel Sanctum** para autenticación mediante Bearer Tokens.\n- Para\
    \ autenticarse, envíe una petición `POST /api/login` con sus credenciales.\n- En las peticiones posteriores,\
    \ incluya la cabecera HTTP:\n  ```http\n  Authorization: Bearer <tu_token_aqui>\n  Accept: application/json\n\
    \  ```\n\n### Cuentas Semilla de Prueba (Entorno de Desarrollo)\n| Rol | Correo Institucional | Contraseña\
    \ | Responsabilidad |\n| :--- | :--- | :--- | :--- |\n| **Secretaría / Admin** | `secretaria@uleam.edu.ec`\
    \ | `password` | Autorizaciones, hojas de ruta, choferes, flota, combustible y compensaciones. |\n\
    | **Docente / Solicitante** | `docente@uleam.edu.ec` | `password` | Creación de solicitudes, manifiesto\
    \ de estudiantes y seguimiento. |\n| **Vicerrectorado** | `vicerrector@uleam.edu.ec` | `password`\
    \ | Aprobación de viajes externos a escala nacional. |\n| **Conductor / Chofer** | `conductor@uleam.edu.ec`\
    \ | `password` | Aceptación de viajes, registro de paradas, novedad en ruta y viáticos. |\n| **Mecánico\
    \ de Patio** | `mecanico@uleam.edu.ec` | `password` | Inspecciones pre-operacionales, actas garita\
    \ y órdenes de mantenimiento. |\n| **Facultad** | `facultad@uleam.edu.ec` | `password` | Supervisión\
    \ de movilizaciones adscritas a la unidad académica. |\n| **Estudiante** | `estudiante@uleam.edu.ec`\
    \ | `password` | Confirmación de participación como pasajero. |\n No es una firma asimétrica o certificada\
    \ embebida en el PDF."
  version: 1.0.0
  contact:
    name: Dirección de Transporte y Mantenimiento - ULEAM
    email: transporte@uleam.edu.ec
    url: https://www.uleam.edu.ec
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:8000
  description: Servidor Backend de Desarrollo (Laravel)
- url: http://localhost:5173
  description: Proxy Frontend de Desarrollo (Vite)
tags:
- name: Autenticación
  description: Inicio de sesión, registro público, cierre de sesión y perfil del usuario autenticado.
- name: Solicitudes de Movilización
  description: Creación, consulta, flujo de trazabilidad y autorizaciones de solicitudes.
- name: Participantes y Pasajeros
  description: Búsqueda de alumnos, invitaciones para viajes y confirmación de asistencia.
- name: Hojas de Ruta y Agenda
  description: Emisión de hojas de ruta, respuesta de chofer, paradas GPS y calendario semanal.
- name: Flota y Conductores
  description: Control de vehículos, documentos legales (SOAT, matrícula), choferes y asignación.
- name: Combustible y Estaciones
  description: Convenios con estaciones de servicio y órdenes de combustible con despacho.
- name: Compensaciones y Viáticos
  description: Cálculo, liquidación, aprobación y confirmación de horas extras y viáticos.
- name: Taller y Garita
  description: Actas de entrega-recepción, inspecciones pre/post viaje, novedades y órdenes de trabajo.
- name: Documentos y Firma Digital
  description: Generación de formatos PDF de calidad con hash SHA-256, firmas digitales y verificación
    pública.
- name: Alertas y Notificaciones
  description: Campana de notificaciones operativas en tiempo real y lectura de avisos.
- name: Monitoreo y Evaluaciones
  description: Seguimiento satelital en mapas y evaluación de calidad del servicio por pasajeros.
- name: Reportes y Métricas
  description: KPIs institucionales, reportes consolidados de flota, viajes, combustible y auditoría.
- name: Tarifas Institucionales
  description: Configuración de factores de costo por kilómetro, horas extras y pernoctes.
- name: Administración Maestra
  description: Mantenimiento maestro de usuarios, roles, catálogo de vehículos y choferes.
paths:
  /api/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión y obtener token Sanctum
      description: Valida las credenciales del usuario y genera un nuevo bearer token con sus roles asignados.
      operationId: post_api_login
      responses:
        '200':
          description: Sesión iniciada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Sesión iniciada exitosamente
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
        '401':
          description: Credenciales inválidas
        '422':
          description: Error de validación en campos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
  /api/register:
    post:
      tags:
      - Autenticación
      summary: Registro público de estudiantes y solicitantes
      description: Permite registrar nuevos usuarios con rol estudiante o docente en el sistema.
      operationId: post_api_register
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - national_id
              - first_name
              - last_name
              - email
              - password
              - password_confirmation
              properties:
                national_id:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                faculty_institution:
                  type: string
  /api/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión actual
      description: Revoca el token actual de autenticación del usuario.
      operationId: post_api_logout
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
  /api/me:
    get:
      tags:
      - Autenticación
      summary: Obtener perfil del usuario autenticado
      description: Retorna la información del usuario en sesión junto con sus roles canónicos y permisos.
      operationId: get_api_me
      responses:
        '200':
          description: Datos de perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  roles:
                    type: array
                    items:
                      type: string
      security:
      - bearerAuth: []
  /api/solicitudes:
    get:
      tags:
      - Solicitudes de Movilización
      summary: Listar solicitudes de movilización
      description: Obtiene las solicitudes filtradas según el rol del usuario (docente solo ve las suyas,
        secretaría todas).
      operationId: get_api_solicitudes
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
        description: Filtrar por estado (pendiente, autorizado, aprobado, asignado, etc.)
      - name: from_date
        in: query
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          default: 1
    post:
      tags:
      - Solicitudes de Movilización
      summary: Crear nueva solicitud de movilización
      description: Permite a un docente o autoridad de facultad generar una solicitud institucional.
      operationId: post_api_solicitudes
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - origin
              - destination
              - start_date
              - end_date
              - reason
              - mobilization_type
              - passenger_count
              properties:
                origin:
                  type: string
                  example: Campus Manta - Matriz
                destination:
                  type: string
                  example: Quito - Sede PUCE
                start_date:
                  type: string
                  format: date
                  example: '2026-10-15'
                end_date:
                  type: string
                  format: date
                  example: '2026-10-18'
                start_time:
                  type: string
                  example: 06:00
                end_time:
                  type: string
                  example: '20:00'
                reason:
                  type: string
                  example: Participación en Congreso Nacional de Software.
                mobilization_type:
                  type: string
                  enum:
                  - interna
                  - externa
                  example: externa
                passenger_count:
                  type: integer
                  example: 22
                destination_latitude:
                  type: number
                  example: -0.1807
                destination_longitude:
                  type: number
                  example: -78.4678
                student_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 14
                  - 15
                  - 16
  /api/solicitudes/{id}/flujo:
    get:
      tags:
      - Solicitudes de Movilización
      summary: Consultar trazabilidad y fases del ciclo de vida
      description: Devuelve el historial cronológico y diagrama de fases (autorizado, aprobado, asignado,
        en ruta).
      operationId: get_api_solicitudes_id_flujo
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
  /api/solicitudes/{id}/autorizar-secretaria:
    patch:
      tags:
      - Solicitudes de Movilización
      summary: Autorizar o rechazar solicitud por Secretaría
      description: Secretaría de Transporte evalúa la disponibilidad vehicular y autoriza la prosecución
        del trámite.
      operationId: patch_api_solicitudes_id_autorizar-secretaria
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - authorized
              properties:
                authorized:
                  type: boolean
                  example: true
                observation:
                  type: string
                  example: Disponibilidad de bus interprovincial confirmada.
  /api/solicitudes/{id}/aprobar-rectorado:
    patch:
      tags:
      - Solicitudes de Movilización
      summary: Aprobación superior por Vicerrectorado / Rectorado
      description: Requisito mandatorio para solicitudes de tipo 'externa' (viajes fuera de Manabí).
      operationId: patch_api_solicitudes_id_aprobar-rectorado
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - approved
              properties:
                approved:
                  type: boolean
                  example: true
                observation:
                  type: string
                  example: Comisión académica aprobada con fondos institucionales.
  /api/estudiantes:
    get:
      tags:
      - Participantes y Pasajeros
      summary: Buscar estudiantes universitarios para invitar a viajes
      description: Permite buscar alumnos por nombre, apellido, correo institucional o cédula.
      operationId: get_api_estudiantes
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: Zambrano
  /api/solicitudes/{id}/participantes:
    get:
      tags:
      - Participantes y Pasajeros
      summary: Listar participantes de una solicitud
      description: Listar participantes de una solicitud
      operationId: get_api_solicitudes_id_participantes
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
      - Participantes y Pasajeros
      summary: Agregar estudiantes o participantes al manifiesto
      description: Agregar estudiantes o participantes al manifiesto
      operationId: post_api_solicitudes_id_participantes
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  example: 25
                student_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 25
                  - 26
                  - 27
  /api/mis-invitaciones:
    get:
      tags:
      - Participantes y Pasajeros
      summary: Invitaciones recibidas por el estudiante autenticado
      description: El estudiante visualiza los viajes a los cuales ha sido convocado por sus docentes.
      operationId: get_api_mis-invitaciones
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
  /api/participantes/{id}/responder:
    patch:
      tags:
      - Participantes y Pasajeros
      summary: Aceptar o rechazar invitación a movilización
      description: Aceptar o rechazar invitación a movilización
      operationId: patch_api_participantes_id_responder
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - aceptado
                  - rechazado
                  example: aceptado
                reason:
                  type: string
                  example: Cruce de horario con examen de Cálculo.
  /api/hojas-ruta:
    post:
      tags:
      - Hojas de Ruta y Agenda
      summary: Emitir hoja de ruta y asignar chofer/vehículo
      description: Secretaría formaliza la asignación vehicular emitiendo la hoja de ruta oficial (PST-01-F-006).
      operationId: post_api_hojas-ruta
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - solicitud_id
              - driver_id
              - vehicle_id
              - scheduled_departure_date
              - scheduled_departure_time
              properties:
                solicitud_id:
                  type: integer
                  example: 10
                driver_id:
                  type: integer
                  example: 2
                vehicle_id:
                  type: integer
                  example: 3
                scheduled_departure_date:
                  type: string
                  format: date
                  example: '2026-10-15'
                scheduled_departure_time:
                  type: string
                  example: 06:00
  /api/hojas-ruta/{id}/reasignar:
    patch:
      tags:
      - Hojas de Ruta y Agenda
      summary: Reasignar chofer o vehículo ante contingencias
      description: Reasignar chofer o vehículo ante contingencias
      operationId: patch_api_hojas-ruta_id_reasignar
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id:
                  type: integer
                  example: 4
                vehicle_id:
                  type: integer
                  example: 5
                motive:
                  type: string
                  example: Falla mecánica imprevista en bus principal.
  /api/hojas-ruta/{id}/responder:
    patch:
      tags:
      - Hojas de Ruta y Agenda
      summary: Respuesta del conductor ante asignación de hoja de ruta
      description: El chofer acepta o rechaza la asignación programada.
      operationId: patch_api_hojas-ruta_id_responder
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Permisos insuficientes para este recurso
        '422':
          description: Error de validación en los parámetros enviados
          content:
            application/json:
