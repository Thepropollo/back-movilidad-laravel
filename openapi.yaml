components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: Token de autenticación emitido en el endpoint `/api/login` o `/api/register`.
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        national_id:
          type: string
          description: Cédula o documento de identidad (10 dígitos)
        first_name:
          type: string
          example: Juan Carlos
        last_name:
          type: string
          example: Pérez
        email:
          type: string
          format: email
        faculty_institution:
          type: string
          example: FACULTAD DE CIENCIAS INFORMATICAS
        job_title:
          type: string
          nullable: true
          example: Docente Titular
        role_id:
          type: integer
          example: 4
        is_active:
          type: boolean
          example: true
        role:
          $ref: '#/components/schemas/Role'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: secretaria
        description:
          type: string
          example: Secretaría / Administrativo
    MobilizationRequest:
      type: object
      properties:
        id:
          type: integer
          example: 10
        requester_id:
          type: integer
          example: 1
        origin:
          type: string
          example: Campus Manta - Matriz
        destination:
          type: string
          example: Chone - Centro Experimental
        start_date:
          type: string
          format: date
          example: '2026-10-05'
        end_date:
          type: string
          format: date
          example: '2026-10-06'
        start_time:
          type: string
          example: 07:30
        end_time:
          type: string
          example: '18:00'
        reason:
          type: string
          example: Práctica de campo y vinculación comunitaria.
        mobilization_type:
          type: string
          enum:
          - interna
          - externa
          example: interna
        passenger_count:
          type: integer
          example: 15
        destination_latitude:
          type: number
          nullable: true
          example: -0.6934
        destination_longitude:
          type: number
          nullable: true
          example: -80.0931
        status:
          type: string
          enum:
          - pendiente
          - autorizado
          - aprobado
          - rechazado
          - asignado
          - en_ruta
          - completado
          - liquidado
          example: autorizado
        authorized_by_secretary:
          type: boolean
          example: true
        approved_by_rectorate:
          type: boolean
          example: false
        rejection_reason:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-09-29T10:00:00Z'
        requester:
          $ref: '#/components/schemas/User'
    RouteSheet:
      type: object
      properties:
        id:
          type: integer
          example: 5
        mobilization_request_id:
          type: integer
          example: 10
        vehicle_id:
          type: integer
          example: 3
        driver_id:
          type: integer
          example: 2
        scheduled_departure_date:
          type: string
          format: date
          example: '2026-10-05'
        scheduled_departure_time:
          type: string
          example: 07:30
        status:
          type: string
          enum:
          - pendiente
          - asignado
          - en_camino
          - finalizado
          example: asignado
        driver_status:
          type: string
          enum:
          - pendiente
          - aceptado
          - rechazado
          example: aceptado
        rejection_reason:
          type: string
          nullable: true
        initial_mileage:
          type: number
          nullable: true
          example: 45200.5
        final_mileage:
          type: number
          nullable: true
          example: 45430.0
        driver:
          $ref: '#/components/schemas/Driver'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          example: 3
        plate_number:
          type: string
          example: MEA-1234
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Coaster
        year:
          type: integer
          example: 2022
        capacity:
          type: integer
          example: 28
        fuel_type:
          type: string
          enum:
          - diesel
          - extra
          - super
          example: diesel
        current_mileage:
          type: number
          example: 45200.5
        status:
          type: string
          enum:
          - disponible
          - en_viaje
          - mantenimiento
          - inactivo
          example: disponible
    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 2
        user_id:
          type: integer
          example: 4
        license_number:
          type: string
          example: '1312345678'
        license_type:
          type: string
          example: Tipo D
        license_expiration:
          type: string
          format: date
          example: '2027-12-31'
        status:
          type: string
          enum:
          - disponible
          - en_viaje
          - descanso
          - inactivo
          example: disponible
        user:
          $ref: '#/components/schemas/User'
    ServiceStation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Estación de Servicios Primax El Palmar
        address:
          type: string
          example: Av. 4 de Noviembre y Calle 119
        city:
          type: string
          example: Manta
        phone:
          type: string
          example: '052620000'
        has_agreement:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
    FuelOrder:
      type: object
      properties:
        id:
          type: integer
          example: 12
        order_code:
          type: string
          example: COMB-2026-0045
        route_sheet_id:
          type: integer
          example: 5
        service_station_id:
          type: integer
          example: 1
        fuel_type:
          type: string
          example: diesel
        gallons_requested:
          type: number
          example: 15.5
        gallons_dispatched:
          type: number
          nullable: true
          example: 15.5
        total_amount:
          type: number
          nullable: true
          example: 27.9
        voucher_number:
          type: string
          nullable: true
          example: V-998877
        status:
          type: string
          enum:
          - emitida
          - despachada
          - anulada
          example: despachada
        dispatched_at:
          type: string
          format: date-time
          nullable: true
    DriverCompensation:
      type: object
      properties:
        id:
          type: integer
          example: 3
        route_sheet_id:
          type: integer
          example: 5
        driver_id:
          type: integer
          example: 2
        extra_hours:
          type: number
          example: 4.0
        extra_hours_amount:
          type: number
          example: 24.5
        per_diem_amount:
          type: number
          example: 35.0
        subsistence_amount:
          type: number
          example: 15.0
        total_amount:
          type: number
          example: 74.5
        status:
          type: string
          enum:
          - pendiente
          - liquidado
          - aprobado
          - confirmado
          example: aprobado
        liquidated_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
    DeliveryReceptionAct:
      type: object
      properties:
        id:
          type: integer
          example: 7
        route_sheet_id:
          type: integer
          example: 5
        vehicle_id:
          type: integer
          example: 3
        initial_mileage:
          type: number
          example: 45200.0
        final_mileage:
          type: number
          nullable: true
          example: 45430.0
        initial_fuel_level:
          type: string
          example: 3/4
        final_fuel_level:
          type: string
          nullable: true
          example: 1/2
        status:
          type: string
          enum:
          - salida
          - llegada
          example: llegada
    WorkshopWorkOrder:
      type: object
      properties:
        id:
          type: integer
          example: 4
        vehicle_id:
          type: integer
          example: 3
        mechanic_id:
          type: integer
          example: 5
        issue_description:
          type: string
          example: Mantenimiento preventivo de frenos y cambio de aceite.
        priority:
          type: string
          enum:
          - baja
          - media
          - alta
          - urgente
          example: alta
        status:
          type: string
          enum:
          - abierta
          - en_proceso
          - cerrada
          example: cerrada
        work_performed:
          type: string
          nullable: true
          example: Se sustituyeron pastillas de freno y filtro de aceite.
        final_cost:
          type: number
          nullable: true
          example: 85.5
        closed_at:
          type: string
          format: date-time
          nullable: true
    GeneratedDocument:
      type: object
      properties:
        id:
          type: integer
          example: 15
        document_type:
          type: string
          example: orden_movilizacion
        source:
          type: string
          example: sistema
        request_id:
          type: integer
          nullable: true
          example: 10
        original_filename:
          type: string
          example: orden_movilizacion_10.pdf
        file_hash:
          type: string
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        file_url:
          type: string
          example: /api/documentos/15/archivo
        created_at:
          type: string
          format: date-time
    Alert:
      type: object
      properties:
        id:
          type: integer
          example: 22
        user_id:
          type: integer
          example: 1
        title:
          type: string
          example: Solicitud Autorizada
        message:
          type: string
          example: Su solicitud de movilización a Chone ha sido autorizada por secretaría.
        read:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
    RateConfiguration:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: KM_EXTRA
        name:
          type: string
          example: Costo por Kilómetro Adicional
        rate_type:
          type: string
          example: kilometraje
        value:
          type: number
          example: 0.45
        is_active:
          type: boolean
          example: true
    ApiResponseSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operación realizada exitosamente
        data:
          type: object
    ApiResponseError:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Mensaje detallado del error
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
